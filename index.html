<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Downloader</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #0b0b10;
    --panel: #131319;
    --line: #24242e;
    --ink: #f2f1ee;
    --dim: #8b8b98;
    --cyan: #4bf5c9;
    --pink: #ff4d8d;
    --warn: #ffb84b;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(75,245,201,0.08), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(255,77,141,0.08), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 80px;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--cyan);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .eyebrow::before{
    content:"";
    width:7px;height:7px;border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 12px var(--cyan);
  }

  h1{
    font-size:clamp(38px, 7vw, 68px);
    line-height:0.95;
    margin:0 0 10px;
    font-weight:700;
    letter-spacing:-0.02em;
    text-align:center;
  }
  h1 .rip{
    background:linear-gradient(90deg, var(--cyan), var(--pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .sub{
    color:var(--dim);
    font-size:15px;
    text-align:center;
    max-width:480px;
    margin:0 0 44px;
    line-height:1.55;
  }

  form{
    width:100%;
    max-width:640px;
    display:flex;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px;
  }
  input[type="url"]{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    padding:14px 16px;
  }
  input[type="url"]::placeholder{color:#4d4d59;}

  button{
    background:var(--ink);
    color:#0b0b10;
    border:none;
    border-radius:9px;
    padding:0 26px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
    white-space:nowrap;
  }
  button:hover{background:var(--cyan);}
  button:active{transform:scale(0.97);}
  button:disabled{opacity:0.5;cursor:wait;}

  .hint{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:#54545f;
    margin-top:12px;
    letter-spacing:0.02em;
  }

  .status{
    max-width:640px;
    width:100%;
    margin-top:24px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--warn);
    display:none;
    text-align:center;
  }
  .status.show{display:block;}
  .status.error{color:var(--pink);}

  .result{
    display:none;
    width:100%;
    max-width:640px;
    margin-top:32px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
  }
  .result.show{display:block;}

  .result-top{
    display:flex;
    gap:16px;
    padding:20px;
    border-bottom:1px solid var(--line);
  }
  .thumb{
    width:96px;
    height:128px;
    border-radius:10px;
    object-fit:cover;
    background:#1a1a22;
    flex-shrink:0;
  }
  .meta{min-width:0;}
  .meta .author{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--cyan);
    margin-bottom:6px;
  }
  .meta .title{
    font-size:14px;
    line-height:1.45;
    color:var(--ink);
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .meta .duration{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--dim);
    margin-top:8px;
  }

  .player{
    padding:20px;
    border-bottom:1px solid var(--line);
  }
  .player video{
    width:100%;
    max-height:520px;
    border-radius:12px;
    background:#000;
    display:block;
  }

  .download-main{
    width:100%;
    margin-top:16px;
    background:linear-gradient(90deg, var(--cyan), var(--pink));
    color:#0b0b10;
    border:none;
    border-radius:10px;
    padding:16px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:filter .15s ease, transform .15s ease;
  }
  .download-main:hover{filter:brightness(1.08);}
  .download-main:active{transform:scale(0.98);}
  .download-main:disabled{opacity:0.55;cursor:wait;}

  .dl-progress{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--dim);
    text-align:center;
    margin-top:10px;
    min-height:14px;
  }

  .other-quality{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:#4d4d59;
    text-transform:uppercase;
    letter-spacing:0.1em;
    margin:22px 0 10px;
  }

  .links{
    padding:0 20px 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .link-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#0e0e14;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
  }
  .link-row .label{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--dim);
  }
  .link-row .label b{color:var(--ink);font-weight:700;}
  .link-row a{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:700;
    color:var(--bg);
    background:var(--ink);
    text-decoration:none;
    padding:8px 14px;
    border-radius:7px;
    transition:background .15s ease;
    cursor:pointer;
  }
  .link-row a:hover{background:var(--pink);color:var(--ink);}

  footer{
    margin-top:60px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:#3f3f49;
    text-align:center;
  }

  @media (max-width:480px){
    form{flex-direction:column;}
    button{padding:14px;}
  }
</style>
</head>
<body>

  <div class="eyebrow">Download Video Tiktok By Dinz Code</div>
  <h1>Tarik videonya,<br class="br-desktop"> bukan <span class="rip">watermark</span>-nya.</h1>
  <p class="sub">Tempel link TikTok — dapat versi HD tanpa watermark dalam hitungan detik.</p>

  <form id="form">
    <input type="url" id="urlInput" placeholder="https://vm.tiktok.com/..." required>
    <button type="submit" id="submitBtn">Proses</button>
  </form>
  <div class="hint">tempel link video tiktok nya</div>

  <div class="status" id="status"></div>

  <div class="result" id="result">
    <div class="result-top">
      <img class="thumb" id="thumb" alt="thumbnail">
      <div class="meta">
        <div class="author" id="author"></div>
        <div class="title" id="title"></div>
        <div class="duration" id="duration"></div>
      </div>
    </div>
    <div class="player">
      <video id="videoPlayer" controls playsinline preload="metadata"></video>
      <button class="download-main" id="downloadBtn">Download</button>
      <div class="dl-progress" id="dlProgress"></div>
    </div>
    <div class="other-quality">kualitas lain</div>
    <div class="links" id="links"></div>
  </div>

  <footer>by : dinz code &middot; cepat dan aman</footer>

<script>
const form = document.getElementById('form');
const urlInput = document.getElementById('urlInput');
const submitBtn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const thumbEl = document.getElementById('thumb');
const authorEl = document.getElementById('author');
const titleEl = document.getElementById('title');
const durationEl = document.getElementById('duration');
const linksEl = document.getElementById('links');
const videoPlayer = document.getElementById('videoPlayer');
const downloadBtn = document.getElementById('downloadBtn');
const dlProgress = document.getElementById('dlProgress');

let currentVideoUrl = '';
let currentFileName = 'tiktok-video.mp4';

function safeFileName(str){
  return (str || 'tiktok-video')
    .replace(/[^\w\-. ]+/g, '')
    .trim()
    .slice(0, 60) || 'tiktok-video';
}

async function forceDownload(url, filename, btnEl, progressEl){
  const originalLabel = btnEl ? btnEl.textContent : '';
  try{
    if(btnEl){ btnEl.disabled = true; btnEl.textContent = 'Mengunduh...'; }
    if(progressEl) progressEl.textContent = 'Sedang mengambil file video...';

    const res = await fetch(url);
    if(!res.ok) throw new Error('Gagal ambil file (status ' + res.status + ')');

    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(blobUrl);

    if(progressEl) progressEl.textContent = 'Selesai, cek folder unduhan.';
  }catch(err){
    // fallback: kalau CORS/fetch gagal, buka tab baru supaya user bisa unduh manual
    if(progressEl) progressEl.textContent = 'Unduh otomatis gagal (' + err.message + '), membuka di tab baru...';
    window.open(url, '_blank', 'noopener');
  }finally{
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = originalLabel; }
    setTimeout(() => { if(progressEl) progressEl.textContent = ''; }, 4000);
  }
}

function setStatus(msg, isError){
  statusEl.textContent = msg;
  statusEl.classList.toggle('show', !!msg);
  statusEl.classList.toggle('error', !!isError);
}

function fmtDuration(sec){
  if(!sec && sec !== 0) return '';
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return `${m}:${s.toString().padStart(2,'0')} durasi`;
}

downloadBtn.addEventListener('click', () => {
  if(!currentVideoUrl) return;
  forceDownload(currentVideoUrl, currentFileName, downloadBtn, dlProgress);
});

async function processUrl(url){
  if(!url) return;

  resultEl.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Memproses...';
  setStatus('Mengambil data dari server...', false);

  try{
    const apiUrl = 'https://api.azbry.com/api/download/tiktok?url=' + encodeURIComponent(url);
    const res = await fetch(apiUrl);
    if(!res.ok) throw new Error('Server API mengembalikan status ' + res.status);
    const data = await res.json();

    if(!data.status || !data.result){
      throw new Error(data.message || 'Video tidak ditemukan atau link tidak valid');
    }

    const r = data.result;
    thumbEl.src = r.thumbnail || '';
    authorEl.textContent = '@' + (r.author || 'unknown');
    titleEl.textContent = r.title || '(tanpa judul)';
    durationEl.textContent = fmtDuration(r.duration);

    const mainLink = (r.links && r.links[0]) || '';
    currentVideoUrl = mainLink;
    currentFileName = safeFileName((r.author || 'tiktok') + '-' + (r.title || 'video')) + '.mp4';

    videoPlayer.src = mainLink;
    videoPlayer.poster = r.thumbnail || '';

    const labels = ['Video HD (tanpa watermark)', 'Video standar (tanpa watermark)', 'Video dengan watermark'];
    linksEl.innerHTML = '';
    (r.links || []).forEach((link, i) => {
      const row = document.createElement('div');
      row.className = 'link-row';
      const a = document.createElement('a');
      a.textContent = 'Unduh';
      a.addEventListener('click', () => forceDownload(link, currentFileName.replace('.mp4', `-${i+1}.mp4`), a, dlProgress));
      row.innerHTML = `<span class="label"><b>${labels[i] || 'Link video ' + (i+1)}</b></span>`;
      row.appendChild(a);
      linksEl.appendChild(row);
    });

    if(r.music && r.music.url){
      const row = document.createElement('div');
      row.className = 'link-row';
      const a = document.createElement('a');
      a.textContent = 'Unduh';
      a.addEventListener('click', () => forceDownload(r.music.url, safeFileName(r.author + '-audio') + '.mp3', a, dlProgress));
      row.innerHTML = `<span class="label"><b>Audio asli</b></span>`;
      row.appendChild(a);
      linksEl.appendChild(row);
    }

    resultEl.classList.add('show');
    setStatus('', false);
  }catch(err){
    setStatus('Gagal: ' + err.message, true);
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = 'Proses';
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  processUrl(urlInput.value.trim());
});

// auto-proses begitu link ditempel (paste) di kolom input
urlInput.addEventListener('paste', () => {
  setTimeout(() => {
    const val = urlInput.value.trim();
    if(/^https?:\/\/.+tiktok/i.test(val) || /^https?:\/\/vm\.tiktok|vt\.tiktok/i.test(val)){
      processUrl(val);
    }
  }, 50);
});

// auto-proses juga kalau user ketik/tempel manual lalu berhenti sejenak
let typingTimer;
urlInput.addEventListener('input', () => {
  clearTimeout(typingTimer);
  const val = urlInput.value.trim();
  if(!/tiktok/i.test(val)) return;
  typingTimer = setTimeout(() => processUrl(val), 700);
});
</script>
</body>
</html>
