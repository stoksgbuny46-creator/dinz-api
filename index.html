<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinz Chat — AI Chat Cepat</title>
<meta name="description" content="Web chat AI cepat, bisa kirim teks dan foto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF9; --bg-alt:#F2F1EF; --ink:#15161A; --muted:#6B6D76;
    --line:#E4E3E0; --accent:#4F46E5; --accent-soft:#EEF0FF; --accent-ink:#3730A3;
    --danger:#DC2626;
  }
  html[data-theme="dark"]{
    --bg:#15161A; --bg-alt:#1F2025; --ink:#F2F1EF; --muted:#94959E;
    --line:#2E2F36; --accent:#6C63FF; --accent-soft:#252449; --accent-ink:#C7C4FF;
    --danger:#F87171;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:15.5px;
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
    transition:background .2s,color .2s;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:'Inter',sans-serif;}
  ::selection{background:var(--accent-soft);}

  /* HEADER */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--line); background:var(--bg);
    flex:none;
  }
  .logo{display:flex; align-items:center; gap:9px; font-family:'Sora',sans-serif; font-weight:700; font-size:16px;}
  .logo-dot{width:9px;height:9px;border-radius:50%; background:var(--accent);}
  .status{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted);
    display:flex; align-items:center; gap:6px;
  }
  .status .dot{width:6px;height:6px;border-radius:50%; background:#22C55E;}
  .status.off .dot{background:#D1D0CC;}
  .header-right{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    background:none; border:1px solid var(--line); border-radius:8px;
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--muted); transition:all .15s;
  }
  .icon-btn:hover{border-color:var(--ink); color:var(--ink);}

  /* CHAT AREA */
  main{flex:1; overflow-y:auto; display:flex; justify-content:center;}
  .chat-col{width:100%; max-width:760px; padding:28px 20px 12px; display:flex; flex-direction:column; gap:18px;}

  .empty-state{
    margin:auto; text-align:center; color:var(--muted); max-width:360px; padding:40px 0;
  }
  .empty-state h2{font-family:'Sora',sans-serif; font-size:20px; color:var(--ink); margin-bottom:8px;}
  .empty-state p{font-size:14px; line-height:1.6;}
  .suggestions{display:flex; flex-direction:column; gap:8px; margin-top:20px;}
  .sugg-btn{
    text-align:left; background:var(--bg-alt); border:1px solid var(--line); border-radius:10px;
    padding:11px 14px; font-size:13.5px; color:var(--ink); cursor:pointer; transition:border-color .15s;
  }
  .sugg-btn:hover{border-color:var(--accent);}

  .msg{display:flex; gap:12px; max-width:100%;}
  .msg.user{flex-direction:row-reverse;}
  .avatar{
    width:30px; height:30px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora',sans-serif; font-weight:700; font-size:12px; color:#fff;
  }
  .avatar.ai{background:linear-gradient(135deg,var(--accent),#8B85F0);}
  .avatar.user{background:var(--ink);}
  .bubble{
    padding:11px 15px; border-radius:14px; font-size:14.5px; line-height:1.6;
    max-width:78%; white-space:pre-wrap; word-wrap:break-word;
  }
  .msg.user .bubble{background:var(--accent); color:#fff; border-bottom-right-radius:4px;}
  .msg.ai .bubble{background:var(--bg-alt); color:var(--ink); border-bottom-left-radius:4px;}
  .msg.error .bubble{background:#FEF2F2; color:var(--danger); border:1px solid #FECACA;}

  .typing{display:flex; gap:4px; padding:4px 2px;}
  .typing span{
    width:6px; height:6px; border-radius:50%; background:var(--muted);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-4px); opacity:1;}}

  .bubble img.msg-img{
    max-width:220px; max-height:220px; border-radius:10px; display:block; margin-top:6px; cursor:pointer;
  }
  .bubble .msg-text + img.msg-img{margin-top:8px;}

  /* INPUT BAR */
  .input-bar{flex:none; border-top:1px solid var(--line); background:var(--bg); padding:14px 20px 18px; display:flex; justify-content:center; flex-direction:column; align-items:center;}
  .input-inner{width:100%; max-width:760px; display:flex; gap:10px; align-items:flex-end;}
  .attach-btn{
    background:none; border:1px solid var(--line); border-radius:12px;
    width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--muted); transition:all .15s;
  }
  .attach-btn:hover{border-color:var(--accent); color:var(--accent);}
  .img-preview-wrap{width:100%; max-width:760px; display:none; padding:0 0 10px;}
  .img-preview-wrap.show{display:flex;}
  .img-preview{
    position:relative; width:60px; height:60px; border-radius:10px; overflow:hidden;
    border:1px solid var(--line);
  }
  .img-preview img{width:100%; height:100%; object-fit:cover;}
  .img-preview .rm{
    position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%;
    background:rgba(21,22,26,.7); color:#fff; border:none; font-size:11px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  textarea{
    flex:1; resize:none; border:1px solid var(--line); border-radius:14px;
    padding:12px 16px; font-family:'Inter',sans-serif; font-size:14.5px; line-height:1.5;
    max-height:160px; background:var(--bg); color:var(--ink);
  }
  textarea:focus{outline:none; border-color:var(--accent);}
  .send-btn{
    background:var(--ink); color:#fff; border:none; border-radius:12px;
    width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .15s;
  }
  .send-btn:hover{background:var(--accent);}
  .send-btn:disabled{background:var(--line); cursor:not-allowed;}
  .hint{
    text-align:center; font-size:11.5px; color:var(--muted); margin-top:8px;
    font-family:'JetBrains Mono',monospace;
  }

  /* MODAL */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(21,22,26,0.5); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg); border-radius:16px; padding:28px; width:100%; max-width:420px;
    border:1px solid var(--line); box-shadow:0 30px 70px -30px rgba(21,22,26,0.4);
  }
  .modal h3{font-family:'Sora',sans-serif; font-size:18px; margin:0 0 8px;}
  .modal p{color:var(--muted); font-size:13.5px; line-height:1.6; margin:0 0 18px;}
  .modal label{font-size:12.5px; font-weight:600; display:block; margin-bottom:6px;}
  .modal input[type=password], .modal select{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px;
    font-family:'JetBrains Mono',monospace; font-size:13px; margin-bottom:16px; background:var(--bg); color:var(--ink);
  }
  .modal input:focus, .modal select:focus{outline:none; border-color:var(--accent);}
  .modal-actions{display:flex; gap:10px;}
  .btn{
    font-weight:600; font-size:14px; padding:11px 18px; border-radius:10px; border:1px solid transparent;
    cursor:pointer; flex:1; text-align:center;
  }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{background:var(--accent);}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .warn{
    background:var(--accent-soft); border:1px solid #DCDBFF; color:var(--accent-ink);
    font-size:12px; padding:10px 12px; border-radius:8px; margin-bottom:16px; line-height:1.5;
  }

  @media(prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="logo-dot"></span>Dinz Chat</div>
  <div class="header-right">
    <span class="status" id="statusPill"><span class="dot"></span><span id="statusText">connected</span></span>
    <button class="icon-btn" id="themeBtn" title="Ganti tema">🌙</button>
    <button class="icon-btn" id="clearBtn" title="Hapus percakapan">🗑</button>
  </div>
</header>

<main>
  <div class="chat-col" id="chatCol">
    <div class="empty-state" id="emptyState">
      <h2>Mulai ngobrol</h2>
      <p>Tanya apa aja, atau kirim foto buat dibahas bareng AI.</p>
      <div class="suggestions">
        <button class="sugg-btn" data-sugg="Jelasin apa itu REST API buat pemula">Jelasin apa itu REST API buat pemula</button>
        <button class="sugg-btn" data-sugg="Kasih ide command unik buat WhatsApp bot">Kasih ide command unik buat WhatsApp bot</button>
        <button class="sugg-btn" data-sugg="Bantu aku bikin caption buat produk digital">Bantu aku bikin caption buat produk digital</button>
      </div>
    </div>
  </div>
</main>

<div class="input-bar">
  <div class="img-preview-wrap" id="imgPreviewWrap"></div>
  <div class="input-inner">
    <button class="attach-btn" id="attachBtn" title="Kirim foto">📎</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <textarea id="userInput" rows="1" placeholder="Tulis pesan..."></textarea>
    <button class="send-btn" id="sendBtn" title="Kirim">➤</button>
  </div>
</div>
<div class="hint">Dinz Chat</div>

<script>
  // ==== GANTI DI SINI ====
  const apiKey = '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';
  const model = 'llama-3.3-70b-versatile';   // model buat chat teks biasa
  const visionModel = 'qwen/qwen3.6-27b';    // model buat chat yang ada fotonya
  // ========================
  let history = [];
  let pendingImage = null; // {dataUrl}

  const chatCol = document.getElementById('chatCol');
  const emptyState = document.getElementById('emptyState');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusText = document.getElementById('statusText');
  const themeBtn = document.getElementById('themeBtn');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const imgPreviewWrap = document.getElementById('imgPreviewWrap');
  statusText.textContent = 'connected';

  // ---- Theme (dark/terang) ----
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('dinzchat-theme', t);
  }
  applyTheme(localStorage.getItem('dinzchat-theme') || 'light');
  themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(current);
  });

  // ---- Lampiran foto ----
  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){
      addMessage('error', 'File yang dipilih bukan gambar.');
      fileInput.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pendingImage = { dataUrl: reader.result };
      renderImgPreview();
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  function renderImgPreview(){
    imgPreviewWrap.innerHTML = '';
    if(!pendingImage){
      imgPreviewWrap.classList.remove('show');
      return;
    }
    imgPreviewWrap.classList.add('show');
    const box = document.createElement('div');
    box.className = 'img-preview';
    const img = document.createElement('img');
    img.src = pendingImage.dataUrl;
    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '✕';
    rm.title = 'Batal kirim foto';
    rm.addEventListener('click', () => { pendingImage = null; renderImgPreview(); });
    box.appendChild(img);
    box.appendChild(rm);
    imgPreviewWrap.appendChild(box);
  }

  document.getElementById('clearBtn').addEventListener('click', () => {
    history = [];
    pendingImage = null;
    renderImgPreview();
    chatCol.innerHTML = '';
    chatCol.appendChild(emptyState);
  });

  document.querySelectorAll('.sugg-btn').forEach(b => {
    b.addEventListener('click', () => {
      userInput.value = b.dataset.sugg;
      sendMessage();
    });
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
  });
  userInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener('click', sendMessage);

  function addMessage(role, text, imageUrl){
    if(emptyState.parentNode) emptyState.remove();
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;
    const av = document.createElement('div');
    av.className = 'avatar ' + (role === 'user' ? 'user' : 'ai');
    av.textContent = role === 'user' ? 'ME' : 'AI';
    const bub = document.createElement('div');
    bub.className = 'bubble';
    if(text){
      const t = document.createElement('div');
      t.className = 'msg-text';
      t.textContent = text;
      bub.appendChild(t);
    }
    if(imageUrl){
      const img = document.createElement('img');
      img.className = 'msg-img';
      img.src = imageUrl;
      img.addEventListener('click', () => window.open(imageUrl, '_blank'));
      bub.appendChild(img);
    }
    msg.appendChild(av);
    msg.appendChild(bub);
    chatCol.appendChild(msg);
    chatCol.parentElement.scrollTop = chatCol.parentElement.scrollHeight;
    return bub;
  }

  function addTyping(){
    if(emptyState.parentNode) emptyState.remove();
    const msg = document.createElement('div');
    msg.className = 'msg ai';
    msg.id = 'typingRow';
    const av = document.createElement('div');
    av.className = 'avatar ai';
    av.textContent = 'AI';
    const bub = document.createElement('div');
    bub.className = 'bubble';
    bub.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    msg.appendChild(av);
    msg.appendChild(bub);
    chatCol.appendChild(msg);
    chatCol.parentElement.scrollTop = chatCol.parentElement.scrollHeight;
  }

  function removeTyping(){
    const t = document.getElementById('typingRow');
    if(t) t.remove();
  }

  async function sendMessage(){
    const text = userInput.value.trim();
    const image = pendingImage;
    if(!text && !image) return;
    if(!apiKey || apiKey.includes('ISI_API_KEY')){
      addMessage('error', 'API key belum diisi — buka file HTML, ganti nilai `apiKey` di bagian atas script.');
      return;
    }

    userInput.value = '';
    userInput.style.height = 'auto';
    addMessage('user', text, image ? image.dataUrl : null);

    // Susun isi pesan user: kalau ada foto, kirim sebagai konten multi-part
    let userContent;
    if(image){
      userContent = [];
      if(text) userContent.push({type:'text', text:text});
      userContent.push({type:'image_url', image_url:{url:image.dataUrl}});
    } else {
      userContent = text;
    }
    history.push({role:'user', content:userContent});
    pendingImage = null;
    renderImgPreview();

    sendBtn.disabled = true;
    addTyping();

    // Pakai model vision kalau ada foto di riwayat pesan yang baru dikirim, kalau tidak pakai model teks biasa
    const usedModel = image ? visionModel : model;

    try{
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model: usedModel,
          messages: [
            {role:'system', content:'Kamu asisten AI yang ramah, jawab dalam Bahasa Indonesia yang natural dan singkat.'},
            ...history
          ]
        })
      });

      removeTyping();

      if(!res.ok){
        const errData = await res.json().catch(() => ({}));
        const errMsg = (errData.error && errData.error.message) || ('HTTP ' + res.status);
        addMessage('error', 'Gagal: ' + errMsg);
        sendBtn.disabled = false;
        return;
      }

      const data = await res.json();
      const reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content
        ? data.choices[0].message.content
        : '(respons kosong)';
      addMessage('ai', reply);
      history.push({role:'assistant', content:reply});
    }catch(err){
      removeTyping();
      addMessage('error', 'Gagal konek ke Groq API: ' + err.message);
    }
    sendBtn.disabled = false;
    userInput.focus();
  }
</script>

</body>
</html>
